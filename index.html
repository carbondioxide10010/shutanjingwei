<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鏁扮⒊缁忕含 鈥?涓纰冲悎瑙勬櫤鑳芥湇鍔″钩鍙?/title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ========== 鍏ㄥ眬閲嶇疆涓庡熀纭€鏍峰紡 ========== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Noto Sans SC', 'Inter', sans-serif;
      color: #1A2B3C;
      background: #F0F5F3;
      line-height: 1.6;
      overflow-x: hidden;
    }
    /* 鏁板瓧瀛椾綋 */
    .num-font {
      font-family: 'DM Sans', 'Noto Sans SC', sans-serif;
    }
    /* 椤甸潰鍒囨崲 */
    .page-section {
      display: none;
    }
    .page-section.active {
      display: block;
    }
    a {
      text-decoration: none;
      color: inherit;
    }

    /* ========== 鎸夐挳绯荤粺 ========== */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #00C48C;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 24px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary:hover {
      background: #00A676;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,196,140,0.3);
    }
    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: #00C48C;
      border: 2px solid #00C48C;
      border-radius: 20px;
      padding: 8px 22px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-outline:hover {
      background: #E6F9F3;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #F0F5F3;
      color: #1A2B3C;
      border: none;
      border-radius: 20px;
      padding: 10px 24px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-secondary:hover {
      background: #E6F9F3;
    }
    .btn-large {
      padding: 14px 36px;
      font-size: 16px;
    }

    /* ========== 鍗＄墖绯荤粺 ========== */
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,196,140,0.1);
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    /* ========== 瀵艰埅鏍?========== */
    .main-header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.85);
      border-bottom: 1px solid rgba(0,196,140,0.1);
      transition: all 0.3s;
    }
    .main-header.scrolled {
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      color: #0D7C5F;
      cursor: pointer;
    }
    .logo i {
      font-size: 24px;
      color: #00C48C;
    }
    .nav-menu {
      display: flex;
      gap: 32px;
      list-style: none;
    }
    .nav-menu a {
      text-decoration: none;
      color: #1A2B3C;
      font-weight: 500;
      font-size: 15px;
      padding: 20px 0;
      position: relative;
      transition: color 0.3s;
      cursor: pointer;
    }
    .nav-menu a:hover,
    .nav-menu a.active {
      color: #00C48C;
    }
    .nav-menu a.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #00C48C;
      border-radius: 1px;
    }
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* ========== 椤甸潰閫氱敤瀹瑰櫒 ========== */
    .page-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .page-title-area {
      margin-bottom: 32px;
    }
    .page-title-area h1 {
      font-size: 36px;
      font-weight: 700;
      color: #0A1628;
    }
    .page-title-area p {
      font-size: 16px;
      color: #5A6B7C;
      margin-top: 6px;
    }

    /* ========== 琛ㄥ崟鍏冪礌 ========== */
    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E0E8E4;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      color: #1A2B3C;
      background: #fff;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #00C48C;
      box-shadow: 0 0 0 3px rgba(0,196,140,0.1);
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #1A2B3C;
      margin-bottom: 6px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .input-icon-wrapper {
      position: relative;
    }
    .input-icon-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #5A6B7C;
      font-size: 14px;
    }
    .input-icon-wrapper input {
      padding-left: 40px;
    }

    /* ========== 琛ㄦ牸 ========== */
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: #F0F5F3;
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      color: #5A6B7C;
      text-transform: uppercase;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #F0F5F3;
      font-size: 14px;
    }
    tr:hover td {
      background: #FAFCFB;
    }

    /* ========== Tab鏍峰紡 ========== */
    .tab-bar {
      display: flex;
      border-bottom: 2px solid #E0E8E4;
      margin-bottom: 0;
    }
    .tab-btn {
      padding: 14px 24px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      color: #5A6B7C;
      position: relative;
      transition: color 0.3s;
    }
    .tab-btn:hover {
      color: #00C48C;
    }
    .tab-btn.active {
      color: #00C48C;
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #00C48C;
    }
    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }
    .tab-content-area {
      background: #fff;
      border-radius: 0 0 16px 16px;
      padding: 32px;
      border: 1px solid rgba(0,196,140,0.1);
      border-top: none;
    }

    /* ========== FAQ鎵嬮鐞?========== */
    .faq-item {
      border: 1px solid #E0E8E4;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      background: #fff;
    }
    .faq-header {
      padding: 16px 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 15px;
      background: #fff;
      transition: background 0.3s;
    }
    .faq-header:hover {
      background: #FAFCFB;
    }
    .faq-header i {
      transition: transform 0.3s;
      color: #00C48C;
      font-size: 14px;
    }
    .faq-item.active .faq-header i {
      transform: rotate(45deg);
    }
    .faq-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .faq-item.active .faq-content {
      max-height: 300px;
    }
    .faq-content-inner {
      padding: 0 20px 16px;
      color: #5A6B7C;
      line-height: 1.7;
      font-size: 14px;
    }

    /* ========== 涓婁紶鍖哄煙 ========== */
    .upload-zone {
      border: 2px dashed #C0D8CF;
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .upload-zone:hover {
      border-color: #00C48C;
      background: #E6F9F3;
    }
    .upload-zone i {
      font-size: 40px;
      color: #00C48C;
      margin-bottom: 12px;
    }
    .upload-zone p {
      color: #5A6B7C;
      font-size: 15px;
    }

    /* ========== 鎻愰啋鏉?========== */
    .alert-bar {
      background: #FFF5F5;
      border-left: 4px solid #E74C3C;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      color: #1A2B3C;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ========== 鐘舵€佹爣绛?========== */
    .status-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-tag.success {
      background: #E6F9F3;
      color: #0D7C5F;
    }
    .status-tag.warning {
      background: #FFF8E6;
      color: #D4900A;
    }
    .status-tag.info {
      background: #EBF2FF;
      color: #3B82F6;
    }

    /* ========== 椤佃剼 ========== */
    .main-footer {
      background: linear-gradient(135deg, #0A1628, #0D2818);
      color: rgba(255,255,255,0.8);
      margin-top: 60px;
    }
    .footer-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 60px 24px 30px;
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 40px;
    }
    .footer-brand .logo {
      color: #fff;
      margin-bottom: 16px;
    }
    .footer-brand .logo span {
      color: #00C48C;
    }
    .footer-brand p {
      font-size: 14px;
      line-height: 1.7;
      opacity: 0.7;
    }
    .footer-col h4 {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .footer-col ul {
      list-style: none;
    }
    .footer-col ul li {
      margin-bottom: 12px;
    }
    .footer-col ul li a {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      transition: color 0.3s;
    }
    .footer-col ul li a:hover {
      color: #00C48C;
    }
    .footer-col .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      margin-bottom: 12px;
      opacity: 0.7;
    }
    .footer-col .contact-item i {
      color: #00C48C;
      width: 16px;
    }
    .footer-bottom {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      opacity: 0.5;
    }
    .footer-bottom a {
      color: rgba(255,255,255,0.6);
      margin-left: 20px;
      transition: color 0.3s;
    }
    .footer-bottom a:hover {
      color: #00C48C;
    }

    /* ================================================================
       鐣岄潰涓€锛氶椤?       ================================================================ */
    /* Hero鍖哄煙 */
    .hero-section {
      min-height: calc(100vh - 64px);
      padding-top: 64px;
      background: linear-gradient(135deg, #E6F9F3 0%, #F0F5F3 50%, #FFFFFF 100%);
      position: relative;
      overflow: hidden;
    }
    /* 瑁呴グblob */
    .hero-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      pointer-events: none;
    }
    .hero-blob-1 {
      width: 400px;
      height: 400px;
      background: #00C48C;
      top: -100px;
      right: -100px;
    }
    .hero-blob-2 {
      width: 300px;
      height: 300px;
      background: #0D7C5F;
      bottom: -50px;
      left: -80px;
    }
    .hero-blob-3 {
      width: 200px;
      height: 200px;
      background: #00C48C;
      top: 40%;
      left: 30%;
    }
    .hero-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 80px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .hero-tag {
      display: inline-block;
      background: #E6F9F3;
      color: #0D7C5F;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
    }
    .hero-title {
      font-size: 56px;
      font-weight: 700;
      color: #0A1628;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .hero-subtitle {
      font-size: 28px;
      color: #0D7C5F;
      font-weight: 600;
      margin-top: 8px;
    }
    .hero-desc {
      font-size: 18px;
      color: #5A6B7C;
      margin-top: 16px;
    }
    .hero-buttons {
      margin-top: 32px;
      display: flex;
      gap: 16px;
    }
    /* Hero鍙充晶浠〃鐩橀瑙堝崱鐗?*/
    .hero-preview-card {
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      position: relative;
    }
    .hero-preview-card .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .hero-preview-card .card-header h3 {
      font-size: 18px;
      font-weight: 600;
      color: #1A2B3C;
    }
    .live-tag {
      background: #E6F9F3;
      color: #0D7C5F;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .live-tag::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #00C48C;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .hero-chart-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 24px;
    }
    .hero-chart-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .hero-chart-center .value {
      font-family: 'DM Sans', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #0A1628;
    }
    .hero-chart-center .unit {
      font-size: 13px;
      color: #5A6B7C;
      margin-top: 2px;
    }
    .scope-indicators {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .scope-item {
      text-align: center;
      padding: 10px;
      background: #F8FBF9;
      border-radius: 10px;
    }
    .scope-item .scope-label {
      font-size: 12px;
      color: #5A6B7C;
      margin-bottom: 4px;
    }
    .scope-item .scope-value {
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
    }
    .scope-item .scope-value.green { color: #00C48C; }
    .scope-item .scope-value.blue { color: #3B82F6; }
    .scope-item .scope-value.orange { color: #F5A623; }

    /* 瀹ｄ紶淇℃伅鍖?*/
    .features-section {
      padding: 80px 0;
    }
    .section-title {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      color: #0A1628;
      margin-bottom: 48px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .feature-card {
      display: flex;
      gap: 20px;
      padding: 28px;
    }
    .feature-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      flex-shrink: 0;
    }
    .feature-icon.green { background: linear-gradient(135deg, #00C48C, #00A676); }
    .feature-icon.blue { background: linear-gradient(135deg, #3B82F6, #2563EB); }
    .feature-icon.purple { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
    .feature-card h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .feature-card p {
      font-size: 14px;
      color: #5A6B7C;
      line-height: 1.6;
    }

    /* 淇′换鏁版嵁鏉?*/
    .trust-bar {
      background: linear-gradient(135deg, #0D7C5F, #00C48C);
      padding: 48px 0;
    }
    .trust-bar-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
      text-align: center;
      color: #fff;
    }
    .trust-item .trust-num {
      font-family: 'DM Sans', sans-serif;
      font-size: 42px;
      font-weight: 700;
    }
    .trust-item .trust-label {
      font-size: 16px;
      opacity: 0.9;
      margin-top: 6px;
    }

    /* ================================================================
       鐣岄潰浜岋細纰虫牳绠?       ================================================================ */
    #page-calc {
      padding-top: 96px;
      padding-bottom: 60px;
    }
    .calc-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 32px;
    }
    .calc-left .card,
    .calc-right .card {
      padding: 28px;
    }
    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #0A1628;
    }
    .card-title i {
      color: #00C48C;
    }
    .helper-links {
      display: flex;
      gap: 16px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #F0F5F3;
    }
    .helper-links a {
      font-size: 13px;
      color: #00C48C;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.3s;
    }
    .helper-links a:hover {
      opacity: 0.8;
    }
    .data-group {
      margin-bottom: 24px;
    }
    .data-group-title {
      font-size: 15px;
      font-weight: 600;
      color: #1A2B3C;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #F0F5F3;
    }
    .data-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    /* 璁＄畻缁撴灉闈㈡澘 */
    .result-panel {
      margin-top: 24px;
      padding: 28px;
    }
    .result-value {
      font-family: 'DM Sans', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #00C48C;
      margin: 12px 0 24px;
    }
    .result-value span {
      font-size: 16px;
      color: #5A6B7C;
      font-weight: 400;
    }
    .scope-bars {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .scope-bar-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .scope-bar-label {
      font-size: 14px;
      font-weight: 500;
      width: 70px;
    }
    .scope-bar-track {
      flex: 1;

      navLinks.forEach(function(link) {

    /* ========== 鏁板瓧璁℃暟鍔ㄧ敾 ========== */
    function animateCountUp(element, target, duration) {
      var start = 0;
      var startTime = null;
      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var current = Math.floor(progress * target);
        element.textContent = current;
        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          element.textContent = target;
        }
      }
      requestAnimationFrame(step);
    }

    // 浣跨敤IntersectionObserver妫€娴嬫暟鎹潯杩涘叆瑙嗗彛
    var trustBar = document.querySelector('.trust-bar');
    if (trustBar) {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            var nums = trustBar.querySelectorAll('.trust-num');
            nums.forEach(function(num) {
              var target = parseInt(num.getAttribute('data-target'));
              animateCountUp(num, target, 1500);
            });
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.5 });
      observer.observe(trustBar);
    }
  </script>
